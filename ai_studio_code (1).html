<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超低速スライドクイズ (テストモード: 1分〜30分)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 3×3 のグリッドコンテナ */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 600px;
    }

    /* 各枠（正方形） */
    .quiz-window {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #2a2a2a;
      border: 2px solid #555;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      container-type: inline-size; /* 枠の幅を基準にフォントサイズを計算 */
    }

    /* 枠番号バッジ */
    .window-label {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 11px;
      color: #888;
      z-index: 10;
    }

    /* スライドする中身 */
    .track {
      display: inline-flex;
      white-space: nowrap;
      position: absolute;
      left: 0;
      /* ★ 枠幅に対して少し控えめ（28cqw）にし、さらに -2px 調整 */
      font-size: calc(28cqw - 2px); 
      will-change: transform;
    }

    .track img {
      height: 60%;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="grid-container" id="grid"></div>

  <script>
    // 基準日時
    const BASE_TIME = new Date('2026-09-01T10:00:00+09:00').getTime();

    // 9問分のデータ設定（分単位）
    const quizData = [
      { id: 1, minutes: 1,  content: "【第1問】太陽系で最も大きい惑星はなんでしょうか？正解を入力してください。" },
      { id: 2, minutes: 2,  content: "【第2問】吾輩は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ。" },
      { id: 3, minutes: 3,  content: "【第3問】春はあけぼの。やうやう白くなりゆく山ぎは、少しあかりて、紫だちたる雲の。" },
      { id: 4, minutes: 5,  content: "【第4問】パンはパンでも食べられないパンはなーんだ？フライパンかな？ピーターパン？" },
      { id: 5, minutes: 7,  content: "【第5問】国境の長いトンネルを抜けると雪国であった。夜の底が白くなった。" },
      { id: 6, minutes: 10, content: "【第6問】寿限無、寿限無、五劫の擦り切れ、海砂利水魚の水行末、雲来末、風来末。" },
      { id: 7, minutes: 15, content: "【第7問】祇園精舎の鐘の声、諸行無常の響きあり。娑羅双樹の花の色、盛者必衰の理をあらはす。" },
      { id: 8, minutes: 20, content: "【第8問】走れメロス。メロスは激怒した。必ず、かの邪智暴虐の王を除かなければならぬと決意した。" },
      { id: 9, minutes: 30, content: "【第9問】時は金なり。少年老い易く学成り難し。一寸の光陰軽んずべからず。" }
    ];

    const gridEl = document.getElementById('grid');

    quizData.forEach((q, index) => {
      const win = document.createElement('div');
      win.className = 'quiz-window';
      win.innerHTML = `
        <span class="window-label">Q${q.id} (${q.minutes}分周期)</span>
        <div class="track" id="track-${index}">${q.content}</div>
      `;
      gridEl.appendChild(win);
    });

    const trackEls = quizData.map((_, i) => document.getElementById(`track-${i}`));

    function updatePositions() {
      const now = Date.now();
      const elapsed = now - BASE_TIME;

      quizData.forEach((q, i) => {
        const periodMs = q.minutes * 60 * 1000;
        
        let progress = (elapsed % periodMs) / periodMs;
        if (progress < 0) progress += 1;

        const track = trackEls[i];
        const windowWidth = track.parentElement.clientWidth;
        const contentWidth = track.scrollWidth;
        const totalDistance = contentWidth + windowWidth;

        const currentX = windowWidth - (progress * totalDistance);
        track.style.transform = `translateX(${currentX}px)`;
      });
    }

    updatePositions();
    setInterval(updatePositions, 50);

    window.addEventListener('resize', updatePositions);
  </script>
</body>
</html>
